name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Backend headless per l'export PDF della partitura (score_visualizer).
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout (con submodule engine)
        uses: actions/checkout@v4
        with:
          # I test smoke (test_engine_bridge) importano e renderizzano via il
          # submodule engine: serve il checkout ricorsivo.
          submodules: recursive

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Dipendenze di sistema (libsndfile per soundfile)
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Installa il pacchetto + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Esegui i test
        run: python -m pytest
