# TEST EXPR — nodo-expr negli assi e strategy expr nello spread.
#
# Copre quattro usi:
#   1. asse con nodo-expr statico: density.base = sagoma * 50 (stream base);
#   2. spread con strategy expr su Env: stessa sagoma a livelli crescenti
#      con i (ventaglio: env * a * (i+1) -> 50, 100, 150, 200);
#   3. spread con expr scalare: volume a gradini di -2 dB per indice;
#   4. banda-let: variabile di let pescata random per ogni stream generato
#      (coro: volume = v - 2*i con v estratto in [-12, -6]).
#
#   make stack STUDY=study_expr_test
#   -> ispeziona generated/study_expr_test/yaml/streams_expanded.yml
#      e il documento stack multi-stream.

study_id: study_expr_test
title: "Test expr — aritmetica su Env"
seed: 7
duration: 20
samples_dir: samples

base:
  onset: 0
  duration: 6
  sample: corpus.wav
  time_mode: normalized
  grain:
    envelope: hanning
  volume: -6
  pointer:
    speed_ratio: 0
    start: .3

axes:
  interpolation: linear
  # uso 1 — nodo-expr statico: la banda (collassata, range 0) segue la
  # sagoma normalizzata moltiplicata per 50 -> Env [[0,50],[1,75]].
  density:
    path: density
    baseline: 20
    n: 5
    base:
      expr: "env * 50"
      let:
        env: [[0, 1], [1, 1.5]]
    range: 0
  grain_duration:
    path: grain.duration
    ramp: {start: .002, stop: .01, step: .002}

stack: {}

streams:
  base: {}

  # uso 2 — strategy expr su Env: 4 generati, stessa sagoma, livello che
  # cresce con l'indice (i 0-based): 50, 100, 150, 200.
  ventaglio:
    spread:
      n: 4
      over:
        axes.density.base:
          expr: "env * a * (i + 1)"
          let:
            env: [[0, 1], [0.1583, 1.5]]
            a: 50

  # uso 3 — expr scalare: gradini di volume, -6, -8, -10 dB.
  # Nota: i/(n-1) e' il progresso normalizzato, qui non serve.
  gradino:
    spread:
      n: 3
      over:
        base.volume:
          expr: "-6 - 2 * i"
        base.onset:
          expr: "4 * i"

  # uso 4 — banda-let: 'v' non e' una forma statica ma una banda, pescata
  # una volta per stream generato (seed derivato stabile: stessa sequenza a
  # ogni rigenerazione; 'seed:' esplicito per congelarla a piacere).
  coro:
    spread:
      n: 3
      over:
        base.volume:
          expr: "v - 2 * i"
          let:
            v: {base: -12, range: 6}
        base.onset:
          expr: "8 + 4 * i"

  # patch 1 — path diverso dalla strategy: il volume e' mio, l'Env calcolato
  # dall'expr (density.base = [[0,100],[0.1583,150]]) resta intatto.
  ventaglio_2:
    base:
      volume: -18

  # patch 2 — sovrascrive proprio il path della strategy: l'Env calcolato
  # del terzo generato viene rimpiazzato da un Env scritto a mano.
  ventaglio_3:
    axes:
      density:
        base: [[0, 42], [1, 42]]

  # patch 3 — rimpiazza l'Env calcolato con un ALTRO nodo-expr: axes.* e' un
  # path-Env, la valutazione avviene alla seam degli assi, non nello spread.
  ventaglio_4:
    axes:
      density:
        base:
          expr: "env * 10"
          let:
            env: [[0, 1], [1, 2]]

  # patch 4 — nodo-expr in base.* (parametro statico): si valuta alla
  # costruzione del documento engine, come un envelope scritto a mano per
  # pge. Vince sul valore calcolato (-8); il fratello onset (4) resta.
  gradino_2:
    base:
      volume:
        expr: "v - 1"
        let: {v: -19}
