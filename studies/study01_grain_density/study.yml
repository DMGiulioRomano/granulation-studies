# Studio 01 — densità, grana, pitch, distribuzione.
#
# Quattro assi sotto osservazione. In modalità `envelope` lo sweep produce un
# file per combinazione di assi, attraversando tutte le permutazioni dei valori
# con plateau e transizioni sincronizzate (ascolto in sequenza continua).

study_id: study01_grain_density
title: "Studio 01 — densità e grana"
seed: 1988
# Cartella del corpus (relativa alla root del repo). Default: samples/
samples_dir: samples

# Stream base: SOLO i parametri che NON sono assi (campi obbligatori di stream e
# valori espliciti diversi dal default engine). I parametri-asse risolvono il
# loro valore a riposo da `axes.*.baseline` o dal default engine (single source
# of truth) — non vanno duplicati qui.
base:
  onset: 0
  duration: 6          # usato solo dalle varianti discrete (mode: discrete | both)
  sample: corpus.wav
  time_mode: normalized
  grain:
    envelope: hanning
  volume: -6
  pointer:
    speed: 0
    start: .3
# Gli assi: path YAML e valori di test. `baseline` (valore a riposo quando l'asse
# non è mosso) è opzionale: se omesso si risolve dal default engine via `path`.
# `plateau`/`transition` (secondi) governano il timing degli envelope.
axes:
  plateau: 5
  transition: 5
  density:
    path: density
    baseline: 20           # obbligatorio: density non ha default engine
    values: [5, 10, 50, 100, 200, 400, 1000]
  grain_duration:
    path: grain.duration
    values: [0.001, 0.01, 0.03, 0.05]     # baseline omesso → default engine 0.05
  distribution:
    path: distribution
    values: [0.0, 0.5, 1.0]       # baseline omesso → default engine 0.0

sweep:
  # envelope | discrete | both. 1=OAT, 2=coppie, 3=terzine, 4=fattoriale completo.
  mode: envelope
  orders: [1, 2, 3]
