# Stati compositivi — da compilare DOPO l'ascolto e la curation delle varianti.
#
# Ogni stato e' un punto nello spazio parametri (gli stessi path dello studio)
# piu' la sua dinamica: dwell (permanenza min/max in secondi), transition_speed
# (secondi per migrare verso il prossimo stato). I tag manuali alimentano la
# similarity. parents/children sono opzionali: se omessi, gli archi del grafo
# vengono derivati dalla matrice di parentela via soglia.
#
# Gli stati qui sotto sono un ESEMPIO illustrativo: sostituiscili con quelli
# emersi dal tuo studio.

states:
  - id: grani_radi
    params:
      density: 5
      grain.duration: 0.2
      pitch.semitones: 0
      distribution: 1.0
    dwell: [4, 10]
    transition_speed: 3.0
    tags: [sparso, lento, grave]

  - id: nuvola
    params:
      density: 50
      grain.duration: 0.05
      pitch.semitones: 0
      distribution: 0.5
    dwell: [3, 8]
    transition_speed: 2.0
    tags: [denso, mobile]

  - id: muro
    params:
      density: 400
      grain.duration: 0.01
      pitch.semitones: 7
      distribution: 0.0
    dwell: [2, 5]
    transition_speed: 1.5
    tags: [denso, acuto, statico]
