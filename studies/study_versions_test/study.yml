# gl-ls
# TEST VERSIONS — coppia di stream con inviluppo condiviso e offset crescente.
#
# Il caso d'uso fondativo del blocco `versions:`: due stream simultanei, il
# fermo campiona l'inviluppo `env` cosi' com'e', il mobile lo stesso inviluppo
# traslato di `d`. Le versioni (d = 1, 2, 3) si concatenano nel tempo dentro
# l'unico documento stack: onset scalati di k*duration, stessi seed -> tra una
# versione e l'altra cambia SOLO d. L'inviluppo e' scritto una volta sola nel
# default di axes; `fermo` ridefinisce solo l'expr (il let si eredita via
# deep-merge); il default `d: 0` tiene lo studio valido anche senza versions.
#
#   make stack STUDY=study_versions_test
#   make render STUDY=study_versions_test

study_id: study_versions_test
title: "Test versions — env condiviso, offset d crescente"
seed: 7
duration: 5
samples_dir: samples

base:
  onset: 0
  sample: corpus.wav
  time_mode: normalized
  grain:
    envelope: hanning
  volume: -6
  pointer:
    #speed_ratio: 0
    #speed_ratio: 0.04
    start: .3

axes:
  interpolation: linear
  density:
    path: density
    baseline: 50
    #n: 12
    base: 
      expr: "(env * f) + d"
      let:
        env: 1
        d: 0
        f: 40
    range: 0
  grain_duration:
    path: grain.duration
    baseline: .01
    base:
      expr: "d * (.1)"
      let:
        d: 0
stack:
  density:
    base: .5
  grain_duration:
    base: .5


versions:
  f:  {ramp: {start: 40, stop: 400, step: 10}}
  d: {ramp: {start: .1, stop: 1, step: .1}}

  #duration: {ramp: {start: 2, stop: 1}}
  #onset: {ramp: {start: 0, stop: 100}}

streams:
  fermo:
    axes.density.base.expr: "env * f"
  mobile: {}
  #ilTerzo: {axes.base.expr: "(env * f) + (d*2)"}
  #ilQuarto: {axes.base.expr: "(env * f) + (d/2)"}
  #ventaglio:
  #  spread:
  #    n: 3
  #    over:
  #      axes.density.base.let.f: {expr: "40 * (i+1)"}
