# gl-ls
# TEST STACK 6 — blocco spread: ventaglio via ramp (PR #15).
#
# Copre: entry-spread con `spread.n` esplicito; strategy ramp a due forme
# ({start, step} offset additivo, non possiede n; {start, stop} suddivisione
# lineare, non possiede n) appaiate per indice su base.pointer.start e
# base.volume; patch omonima che ritocca il terzo generato; sweep spento di
# default sui generati (nessun sweep: nell'entry).
#
#   make stack STUDY=study_stack_test_6_spread_ramp

study_id: study_stack_test_6_spread_ramp
title: "Test stack 6 — spread via ramp"
seed: 6
duration: 20
samples_dir: samples

base:
  onset: 0
  duration: 6
  sample: corpus.wav
  time_mode: normalized
  grain:
    envelope: hanning
  volume: -6
  pointer:
    speed_ratio: 0
    start: .3

axes:
  interpolation: linear
  density:
    path: density
    baseline: 20
    values: [10, 30, 50, 70, 90]
    interpolation: step
  grain_duration:
    path: grain.duration
    ramp: {start: .002, stop: .01, step: .001}

stack: {}

streams:
  base: {}

  # 5 stream generati: pointer.start avanza per offset additivo (0.1, 0.2, ...
  # 0.5), volume si suddivide linearmente in [-18, -6]. n dichiarato in
  # spread.n perche' nessuna delle due ramp lo possiede.
  ventaglio:
    spread:
      n: 5
      over:
        base.pointer.start:
          ramp: {start: 0.1, step: 0.1}
        base.volume:
          ramp: {start: -18, stop: -6}

  # Patch: ritocca il terzo generato (ventaglio_3), consumata all'espansione.
  ventaglio_3:
    base:
      volume: -30
