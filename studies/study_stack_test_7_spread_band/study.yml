# TEST STACK 7 — blocco spread: nube via banda + values, sweep riattivato (PR #15).
#
# Copre: strategy banda che possiede n (base/range/seed propri, senza n in
# spread) appaiata a `values` esplicito (possiede n via len); n derivato
# dall'unico conteggio posseduto (nessun spread.n); seed esplicito sulla banda
# (riproducibilita' dichiarata, non auto-derivata); sweep: {} esplicito
# nell'entry -> riattiva lo sweep per tutti i generati (deroga al default
# spento). Inoltre: `over` fuori da `base.*` — un path dentro `axes.*`
# (correnti) e uno dentro `stack.*` (sciame), a dimostrare che spread scrive
# in un path puntato qualsiasi dell'override di stream, non solo in base.
#
#   make stack STUDY=study_stack_test_7_spread_band

study_id: study_stack_test_7_spread_band
title: "Test stack 7 — spread via banda"
seed: 7
duration: 20
samples_dir: samples

base:
  onset: 0
  duration: 6
  sample: corpus.wav
  time_mode: normalized
  grain:
    envelope: hanning
  volume: -6
  pointer:
    speed_ratio: 0
    start: .3

axes:
  interpolation: linear
  density:
    path: density
    baseline: 20
    values: [10, 30, 50, 70, 90]
    interpolation: step
  grain_duration:
    path: grain.duration
    ramp: {start: .002, stop: .01, step: .001}

stack: {}

streams:
  base: {}

  # 6 stream generati: onset esplicito per stream (values, possiede n=6),
  # volume estratto da una banda seedata in [-20, -8]. Sweep riattivato
  # (blocco sweep vuoto ma dichiarato) -> ogni generato prende le varianti
  # sweep normali invece del solo ascolto verticale.
  nube:
    sweep: {}
    spread:
      over:
        base.onset:
          values: [0, 2, 4, 6, 8, 10]
        base.volume:
          base: -20
          range: 12
          seed: 42

  # over su axes.*: 4 stream generati, ognuno con una baseline diversa per
  # l'asse density (ramp lineare 12 -> 36). L'override finisce dentro
  # axes.density.baseline dell'entry generata, esattamente come lo scriveresti
  # a mano in un override ordinario.
  correnti:
    spread:
      n: 4
      over:
        axes.density.baseline:
          ramp: {start: 12, stop: 36}

  # over su stack.*: camminata-X su density per tutti i generati (richiede la
  # Y in forma banda senza n: qui l'override axes.density passa da 'values'
  # a 'base'/'range', _replace_generators toglie 'values' ereditato). Base e
  # range della frequenza (5-7 Hz) comuni nell'override; spread varia solo il
  # seed per stream -> 4 camminate diverse sulla stessa banda di frequenza,
  # decorrelate a comando invece che per auto-derivazione.
  sciame:
    axes:
      density:
        base: 30
        range: 20
    stack:
      density:
        base: 5
        range: 2
    spread:
      n: 4
      over:
        stack.density.seed:
          values: [11, 12, 13, 14]
