# gl-ls
# Studio 01 (stack) — grani 1-50 samples, ascolto verticale a 7 punti di lettura.
#
# Sette stream identici salvo `pointer.start` (i 7 cugini dello spread gia' in
# uso in grain_1-50smp) suonano INSIEME. All'inizio density e grain.duration
# sono uguali per tutti: l'unica differenza fra gli stream e' il punto in cui
# il puntatore legge il sample.
#
# Il blocco `versions:` muove poi i due parametri: ogni combinazione (d, g)
# replica i 7 cugini piu' avanti nella timeline, cosi' si ascolta in sequenza
# come cambia l'impasto verticale al variare di density e grana.

study_id: study01_stack_1-50smp
title: "Studio 01 (stack) — grani 1-50 samples, 7 punti di lettura"
seed: 1988
duration: 50
samples_dir: samples

# I 7 cugini leggono punti diversi del buffer, che ha punti forti e punti
# deboli: fra il piu' forte (0.25) e il piu' debole (0.8, quasi silenzio) ci
# sono ~33 dB, e sotto quella distanza gli altri spariscono.
#
# `alpha` = quanta parte della distanza si chiude. A 1 il sample perde la sua
# topografia: ogni punto di lettura suona uguale. A 0.7 resta udibile che un
# punto e' piu' forte dell'altro senza che uno mascheri l'altro.
#
# `max_shift` = tetto in dB alla correzione del singolo cugino. Conta perche'
# la compensazione porta tutti verso il piu' DEBOLE (si attenua, non si alza):
# con 7 punti e max_shift 24 il punto a 0.8 s trascina giu' il materiale forte
# di ~46 dB. Con 12 il calo si ferma a 30, con 6 a 18 — e il punto morto smette
# di dettare legge al pezzo.
gain_compensation:
  alpha: 0.7
  max_shift: 12

base:
  onset: 0
  sample: silenzi.wav
  time_mode: normalized
  volume: +10 #-12                 # 7 stream sommati: headroom
  grain:
    envelope: hanning
    duration_unit: samples
  pointer:
    loop_unit: absolute
    speed_ratio: 0
  
# Density e grana non sono piu' costanti dentro la versione: le variabili
# `d`/`g` iniettate da `versions:` diventano il *centro* di una banda che il
# valore percorre a passo d'ubriaco (`drift`). I default nel `let` tengono lo
# studio valido anche senza il blocco (make stack).
#
# Banda: base = centro * 0.7, range = centro * 0.6 -> [0.7c, 1.3c], cioe' +-30%
# intorno al valore della versione. Proporzionale e non assoluta: a g=1 campione
# la banda resta stretta, a g=50 si allarga da sola.
#
# `drift` = passo d'ubriaco: senza, ogni breakpoint e' un pescaggio indipendente
# nella banda (salti, rumore bianco); con drift il primo valore si pesca, poi
# ogni successivo e' `precedente +- passo`, dove il passo vale `step` * la
# larghezza della banda corrente. Quindi step: 0.12 = ogni breakpoint si sposta
# al massimo del 12% della banda rispetto al precedente: il valore *cammina*
# invece di saltare. Sul bordo banda riflette (non si incolla).
# Niente `n` negli assi: qui il conteggio lo possiede la camminata-X (blocco
# `stack:` sotto), e i valori Y si pescano ai tempi reali che la X genera.
axes:
  density:
    baseline: 10
    base:
      range: 1 
      n: 5
      drift: {step: 0.2}
    range: {expr: "d * 0.6", let: {d: 25}}
    drift: {step: 0.12}
  grain.duration:
    baseline: 25
    base: {expr: "g", let: {g: 25}}
    range: {n: 6, base: {expr: ".3 * g", let: {g: 3}}, range: [0, 5]}
    interpolation: step
    drift: {step: 0.32}
  distribution:
    base: 0
    range: .5
    drift:
      step:
        base: 0
        n: 8
        range: .2
# La camminata-X: quanti breakpoint al secondo genera ogni asse (banda in Hz,
# anch'essa a passo d'ubriaco, cosi' nemmeno il ritmo dei cambi e' periodico).
# Density lenta (strutturale, ~1 valore ogni 0.5-2 s), grana veloce (4-10 al
# secondo): i due assi si muovono su scale temporali diverse invece di
# pulsare insieme.
stack:
  density:
    base: 0.5
    range: 1.5
    drift: {step: 0.15}
  grain.duration:
    base: .1
    range: .1
    drift: {step: 0.15}
  distribution:
    base: .3
    range: .1
    drift: {step: .1}

# I 7 punti di lettura del sample (secondi assoluti), indice -> secondi:
#   1=0.1  2=0.25  3=0.4  4=0.55  5=0.8  6=0.915  7=1.1
spread:
  over:
    base.pointer.start:
      values: [0.12, 0.25, 0.4, 0.55, 0.93, 1.1]
    base.pan:
      expr: "(1 - 2 * (i % 2))* (i*27)"

streams:
  # Unico stream logico: lo spread lo moltiplica per 7. Nessun sweep — questo
  # documento vive solo nello stack (ascolto verticale).
  cugini:
    spread:
      over:
        axes.density.base.base:
          expr: "env + i/(10-i)"
          let:
            env:
              base:
                expr: "d"
                let: {d: 25}
              range: 1.5
              drift: {step: .15}
        axes.grain.duration.base:
          expr: "floor(g + i/(10-i))"
          let:
            g: 4
        stack.grain.duration.range:
          expr: "i * .1"

# Prima variabile = esterna/lenta (density), seconda = interna/veloce (grana).
# 3 x 3 = 9 versioni concatenate, 30s ciascuna.
versions:
  g: {ramp: {start: 4, stop: 50, step: 6}}
  d: {ramp: {start: 0, stop: 20, step: 3}}
