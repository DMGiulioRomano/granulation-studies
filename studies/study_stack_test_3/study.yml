# TEST STACK 3 — modello dei seed e mute.
#
# Copre: auto-derivazione per-stream da hash(stream_id) in ASSENZA di seed
# globali (gli stream impilati si decorrelano di default, senza seedarli a mano);
# separazione dominio seed-X / seed-Y (salt :x / :y); precedenza seed (per-asse >
# globale > auto-derivato); mute di uno stream via `base.volume` (engine-native,
# fuori da `stack:`).
#
# NESSUN `axes.seed` e NESSUN `stack.seed` globali: si prova apposta
# l'auto-derivazione. Due stream con la stessa config ma id diverso -> sequenze
# X e Y diverse.
#
#   make stack STUDY=study_stack_test_3

study_id: study_stack_test_3
title: "Test stack 3 — auto-seed per-stream, mute"
seed: 3
duration: 80
samples_dir: samples

base:
  onset: 0
  sample: corpus.wav
  time_mode: normalized
  grain:
    envelope: hanning
  volume: -6
  pointer:
    speed_ratio: 0
    start: .3

axes:
  # nessun `seed:` globale -> seed-Y auto-derivato per-stream da hash(id:y)
  density:
    path: density
    baseline: 20
    rand:
      base: [[0, 80], [.5, 20], [1,18]]
      range: [[0, 120], [.5, 40], [1,12]]
    interpolation: step
  grain_duration:
    path: grain.duration
    rand:
      base: [[0, .080], [.5, .020], [1,.018]]
      range: [[0, .120], [.5, .040], [1,.012]]
    interpolation: step

stack:
  # nessun `seed:` globale -> seed-X auto-derivato per-stream da hash(id:x)
  density:
    rand:
      cps:
        base:  [[.60, .3], [1, 3]]
        range: [[.60, .2], [1, 2]]
  grain_duration:
    rand:
      cps:
        base:  [[.60, .3], [1, 3]]
        range: [[.60, .2], [1, 2]]

streams:
  # Tre stream con config IDENTICA: solo l'id cambia -> auto-seed li decorrela.
  voce_a:
    base: {pointer: {start: 0.2}}
  voce_b:
    base: {pointer: {start: 0.4}}
  voce_c:
    base: {pointer: {start: 0.1}}

  # Stream MUTATO: presente nel documento (entra di default) ma silenziato con
  # un override di volume nel base. E' il modo per escludere uno stream
  # dall'ascolto senza toglierlo dalla mappatura.
  voce_muta:
    base:
      pointer: {start: 0.67}
