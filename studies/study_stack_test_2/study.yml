# TEST STACK 2 — X-strategy `rand` (rspline): la X possiede n.
#
# Copre: X-rand (tempi generati da una frequenza di generazione `cps`, n emerge
# dalla frequenza integrata sulla durata); Y-rand SENZA n campionata ai tempi
# reali dei punti (`rand_at`, coupling X->Y); banda `cps.base` + `cps.range` come
# inviluppi mobili; interpolation cubic (= la spline di rspline); seed-Y globale
# in `axes:`; seed-X globale in `stack:`; seed-X per-asse (vince sul globale);
# un secondo asse a X-linear che coesiste (envelope indipendente, niente combine).
#
#   make stack STUDY=study_stack_test_2

study_id: study_stack_test_2
title: "Test stack 2 — X-rand rspline, seed X e Y"
seed: 2
duration: 30
samples_dir: samples

base:
  onset: 0
  duration: 6
  sample: corpus.wav
  time_mode: normalized
  grain:
    envelope: hanning
  volume: -6
  pointer:
    speed_ratio: 0
    start: .3
  pan: 0

axes:
  density:
    path: density
    baseline: 20
    values: [6]
    # Y-rand SENZA n: e' la X-rand a possedere n. Banda mobile min/max.
    #rand:
    #  min: [[0, 10], [.6, 2], [1, .1]]
    #  max: [[0, 20], [.6, 5], [1, 3]]
    #interpolation: cubic     # morbidezza = spline di rspline
  grain_duration:
    path: grain.duration
    rand:
      min: [[0, .0010], [.6, .01], [1, 0.007]]
      max: [[0, .0020], [.6, .03], [1, .01]]
    interpolation: step     # morbidezza = spline di rspline

stack:
  #density:            # X-rand: la X possiede n (tempi da cps)
  #  rand:
  #    cps:
  #      base:  [[0, .4], [1, 3]]    # frequenza in Hz sulla durata reale
  #      range: [[0, .3], [1, 1]]     # banda = [base, base+range]
  #    seed: 7          # seed-X per-asse (vince sul globale 42)
  # grain_duration assente -> X-linear (n = 19 dalla ramp)
  grain_duration:            # X-rand: la X possiede n (tempi da cps)
    rand:
      cps:
        base:  [[0, .4], [1, 1]]    # frequenza in Hz sulla durata reale
        range: [[0, .1], [1, .2]]     # banda = [base, base+range]

streams:
  # Riferimento con i seed del documento.
  base: {}
  # Override per-stream del seed-X globale: stessi cps, tempi diversi.

  seed_x_diverso:
    base:
      pan: 40
    stack:
      seed: 43
      density:            # X-rand: la X possiede n (tempi da cps)
        rand:
          cps:
            base:  [[0, .4], [1, 3]]    # frequenza in Hz sulla durata reale
            range: [[0, .3], [1, 1]]     # banda = [base, base+range]

    axes:
      density:
        rand:
          min: [[0, 9], [.6, 7], [1, 8]]
          max: [[0, 10], [.6, 8], [1, 10]]
        interpolation: cubic     # morbidezza = spline di rspline
  # Override per-stream del seed-Y globale in axes: stessi tempi (seed-X per-asse
  # invariato), valori Y diversi.
  seed_y_diverso:
    base:
      pan: -60
    axes:
      density:
        values: [10]
